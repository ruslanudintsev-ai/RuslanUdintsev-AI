name: Portfolio skills integrity

on:
  push:
    paths:
      - 'skills/**'
      - 'SKILLS.md'
      - 'SKILLS.ru.md'
      - 'README.md'
      - 'README.ru.md'
      - 'HIRE_ME.md'
      - 'HIRE_ME.ru.md'
      - 'CASE_STUDIES.md'
      - 'PROFILE_README.md'
      - 'AGENTS.md'
      - 'docs/EVIDENCE_INDEX.md'
      - 'docs/EVIDENCE_INDEX.ru.md'
      - 'docs/CASE_MULTI_AGENT_GITHUB.md'
      - 'docs/INDEPENDENT_AGENT_REVIEW.md'
      - 'docs/INDEPENDENT_AGENT_REVIEW.ru.md'
      - 'docs/TRY_IT.md'
      - 'docs/TRY_IT.ru.md'
      - 'ECOSYSTEM.md'
      - 'ECOSYSTEM.ru.md'
      - 'scripts/check_skills.py'
      - 'scripts/check_portfolio_links.py'
      - 'examples/pr-evidence-gate/**'
      - '.github/workflows/skills-check.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'SKILLS.md'
      - 'SKILLS.ru.md'
      - 'README.md'
      - 'README.ru.md'
      - 'HIRE_ME.md'
      - 'HIRE_ME.ru.md'
      - 'CASE_STUDIES.md'
      - 'PROFILE_README.md'
      - 'AGENTS.md'
      - 'docs/EVIDENCE_INDEX.md'
      - 'docs/EVIDENCE_INDEX.ru.md'
      - 'docs/CASE_MULTI_AGENT_GITHUB.md'
      - 'docs/INDEPENDENT_AGENT_REVIEW.md'
      - 'docs/INDEPENDENT_AGENT_REVIEW.ru.md'
      - 'docs/TRY_IT.md'
      - 'docs/TRY_IT.ru.md'
      - 'ECOSYSTEM.md'
      - 'ECOSYSTEM.ru.md'
      - 'scripts/check_skills.py'
      - 'scripts/check_portfolio_links.py'
      - 'examples/pr-evidence-gate/**'
      - '.github/workflows/skills-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry, links and bilingual pages
        run: python scripts/check_skills.py
      - name: Validate portfolio navigation and link privacy
        run: python scripts/check_portfolio_links.py
      - name: Unit-test offline PR evidence gate
        run: python -m unittest discover -s examples/pr-evidence-gate/tests -v
      - name: Smoke-test both synthetic snapshots
        run: |
          python examples/pr-evidence-gate/triage.py --input examples/pr-evidence-gate/sample-approved.json
          python examples/pr-evidence-gate/triage.py --input examples/pr-evidence-gate/sample-blocked.json
